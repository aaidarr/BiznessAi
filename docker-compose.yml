# Production-like stack: app + PostgreSQL. TLS is terminated by a reverse proxy in front (see docs/05-DEPLOY.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: otvet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: otvet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otvet -d otvet"]
      interval: 10s
      timeout: 5s
      retries: 5
    # not published to the host: only the app can reach the database

  app:
    build: .
    image: otvet-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://otvet:${POSTGRES_PASSWORD}@db:5432/otvet
    ports:
      - "127.0.0.1:8000:8000"   # reverse proxy on the host forwards to this
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
