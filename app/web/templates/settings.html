{% extends "base.html" %}
{% block title %}Настройки{% endblock %}
{% block content %}
<h1>Настройки</h1>
<p class="muted">Приветствие и тон бота настраиваются в разделе <a href="/app/bot/personality">«Характер бота»</a>.</p>
<form method="post" action="/app/settings" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="n">Название бизнеса</label><input id="n" name="name" type="text" required maxlength="120" value="{{ biz.name }}">
  <label for="u">Адрес сайта</label><input id="u" name="site_url" type="text" maxlength="500" value="{{ biz.site_url }}">
  <p class="muted">При смене адреса подтверждение владения нужно пройти заново, каналы выключатся.</p>
  <label for="tz">Часовой пояс</label>
  <select id="tz" name="timezone_name">
    {% for tz in ['Europe/Kaliningrad','Europe/Moscow','Europe/Samara','Asia/Yekaterinburg','Asia/Omsk','Asia/Krasnoyarsk','Asia/Irkutsk','Asia/Yakutsk','Asia/Vladivostok','Asia/Magadan','Asia/Kamchatka'] %}
    <option value="{{ tz }}" {% if tz == biz.timezone %}selected{% endif %}>{{ tz }}</option>
    {% endfor %}
  </select>
  <label for="o">Дополнительные сайты для виджета (через пробел)</label><input id="o" name="allowed_origins" type="text" maxlength="1000" value="{{ biz.allowed_origins }}" placeholder="https://shop.example.ru">
  <label for="ml">Минимум минут до записи</label><input id="ml" name="min_lead_minutes" type="number" min="0" max="10080" value="{{ biz.min_lead_minutes }}">
  <label for="rh">Напоминать о записи за (часов)</label><input id="rh" name="reminder_hours" type="number" min="1" max="48" value="{{ biz.reminder_hours }}">
  <p><label class="check"><input type="checkbox" name="auto_confirm" value="1" {% if biz.auto_confirm_bookings %}checked{% endif %}> подтверждать записи автоматически</label></p>
  <button type="submit">Сохранить</button>
</form>
{% endblock %}
